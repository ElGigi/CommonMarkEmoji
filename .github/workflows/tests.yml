name: Tests

on:
    push: ~
    pull_request: ~

jobs:
    phpunit:
        name: PHPUnit on ${{ matrix.php-versions }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, iconv
                  coverage: xdebug
                  tools: composer:v2

            - run: composer update --no-progress

            - run: vendor/bin/phpunit --testsuite=test --coverage-text
